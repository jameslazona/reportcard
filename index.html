<style>
:root{--bg:#F5F4FC;--card:#fff;--text:#14235F;--muted:#5D6488;--line:#E3E1F3;--pri:#5B2ECF;--navy:#0E2266;--acc:#F7B81E;--chip:#EEEAFD;--grad:linear-gradient(135deg,#0B47C9 0%,#5B2ECF 100%);--shadow:0 6px 24px rgba(20,35,95,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right))}
main{max-width:640px;margin:0 auto}
.rc{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.rc-head{background:var(--grad);color:#fff;padding:20px 20px 18px;text-align:center;position:relative}
.rc-head::after{content:"";position:absolute;right:16px;top:16px;width:18px;height:18px;border-radius:50%;background:var(--acc)}
.rc-logo{display:inline-block;background:#fff;border-radius:12px;padding:4px 10px;margin-bottom:10px}
.rc-logo img{height:30px;display:block}
.rc-school{margin:0 0 2px;font-family:"Baloo 2","Nunito",sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc)}
.rc-title{font-family:"Baloo 2","Nunito",sans-serif;font-size:27px;line-height:1.15;margin:2px 0 4px;font-weight:800;text-wrap:balance}
.rc-term{margin:0;font-size:15px;opacity:.92}
.rc-body{padding:18px 18px 8px;display:flex;flex-direction:column;gap:18px}
.rc-info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.rc-info dt{color:var(--muted);font-weight:700}
.rc-info dd{margin:0;font-weight:800;min-width:0}
.rc-sec h2{font-family:"Baloo 2","Nunito",sans-serif;color:var(--pri);font-size:19px;margin:0 0 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--chip);color:var(--navy);text-align:left;padding:9px 10px;font-size:14px}
td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:700}
td+td,th+th{text-align:center}
.rc-comment{margin:0;line-height:1.65;background:var(--bg);border-left:5px solid var(--acc);border-radius:10px;padding:12px 14px}
.rc-foot{color:var(--muted);font-size:13px;text-align:center;padding:4px 18px 18px;margin:0}
.msg{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:28px 22px;text-align:center}
.msg img{height:36px}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function decode(t){t=t.replace(/-/g,'+').replace(/_/g,'/');t+='==='.slice((t.length+3)%4);var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(pako.inflateRaw(u)));}
function show(d){
  document.title=(d.n?d.n+' – ':'')+'Student Progress Report';
  var rows=(d.g||[]).map(function(x){return '<tr><td>'+esc(x[0])+'</td><td>'+(x[1]===null?'–':x[1]+'%')+'</td><td>'+esc(x[2])+'</td></tr>';}).join('');
  document.getElementById('app').innerHTML='<article class="rc"><header class="rc-head"><span class="rc-logo"><img src="'+LG+'" alt="TeachTrack"></span>'
  +'<p class="rc-school">'+esc(d.s||'GRIT SCHOOL')+'</p><h1 class="rc-title">Student Progress Report</h1><p class="rc-term">'+esc([d.t,d.y].filter(Boolean).join(', '))+'</p></header>'
  +'<div class="rc-body"><dl class="rc-info"><dt>Student</dt><dd>'+esc(d.n)+'</dd><dt>Class</dt><dd>'+esc(d.c)+'</dd>'+(d.u?'<dt>Subject</dt><dd>'+esc(d.u)+'</dd>':'')+'</dl>'
  +'<section class="rc-sec"><h2>Grades</h2><div class="tw"><table><thead><tr><th>Grading part</th><th>Grade (%)</th><th>10-point scale</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'
  +'<section class="rc-sec"><h2>Teacher\'s comment</h2><p class="rc-comment">'+(d.m?esc(d.m):'No comment yet.')+'</p></section></div>'
  +'<p class="rc-foot">Shared by your child\'s teacher through TeachTrack. Please contact the teacher with any questions.</p></article>';
}
function fail(){document.getElementById('app').innerHTML='<div class="msg"><img src="'+LG+'" alt="TeachTrack"><p>This report card could not be opened. Please scan the QR code on the card again, or ask the teacher for a new card.</p></div>';}
(function(){var m=location.hash.match(/^#z([A-Za-z0-9_-]{16,})$/);if(!m)return fail();try{show(decode(m[1]));}catch(e){fail();}})();
